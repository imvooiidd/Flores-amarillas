<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Unas flores para vos 🌻</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #fff8c9,
        #ffe680,
        #fff3a3
      );
      display: flex;
      justify-content: center;
      align-items: center;
      color: #4a3600;
    }

    .container {
      position: relative;
      z-index: 5;
      width: min(90%, 430px);
      padding: 35px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.65);
      border: 2px solid rgba(255, 193, 7, 0.4);
      border-radius: 25px;
      box-shadow:
        0 15px 40px rgba(120, 90, 0, 0.18);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    .subtitle {
      font-size: 1rem;
      opacity: 0.75;
      margin-bottom: 20px;
    }

    .flower {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 10px auto 25px;
      animation: float 3s ease-in-out infinite;
    }

    .petal {
      position: absolute;
      width: 65px;
      height: 65px;
      background: #ffd21c;
      border-radius: 50% 50% 45% 45%;
      left: 42px;
      top: 42px;
      transform-origin: 33px 33px;
      box-shadow:
        inset 0 0 10px rgba(190, 130, 0, 0.2);
    }

    .petal:nth-child(1) {
      transform: rotate(0deg) translateY(-38px);
    }
    .petal:nth-child(2) {
      transform: rotate(60deg) translateY(-38px);
    }
    .petal:nth-child(3) {
      transform: rotate(120deg) translateY(-38px);
    }
    .petal:nth-child(4) {
      transform: rotate(180deg) translateY(-38px);
    }
    .petal:nth-child(5) {
      transform: rotate(240deg) translateY(-38px);
    }
    .petal:nth-child(6) {
      transform: rotate(300deg) translateY(-38px);
    }

    .center {
      position: absolute;
      width: 55px;
      height: 55px;
      background: #9b6100;
      border-radius: 50%;
      left: 47px;
      top: 47px;
      z-index: 2;
      box-shadow: 0 0 0 5px #e0a900;
    }

    .message {
      display: none;
      animation: appear 0.8s ease forwards;
    }

    .message h2 {
      margin-bottom: 10px;
      font-size: 1.4rem;
    }

    .message p {
      line-height: 1.6;
      font-size: 1.05rem;
      margin: 0;
    }

    button {
      border: none;
      padding: 14px 26px;
      border-radius: 50px;
      background: #ffc400;
      color: #4a3500;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow:
        0 7px 15px rgba(180, 130, 0, 0.25);
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);
      background: #ffd52e;
    }

    button:active {
      transform: scale(0.96);
    }

    .petal-fall {
      position: fixed;
      top: -30px;
      pointer-events: none;
      z-index: 1;
      animation: fall linear forwards;
    }

    .heart {
      position: fixed;
      bottom: -30px;
      pointer-events: none;
      z-index: 2;
      animation: rise linear forwards;
    }

    .signature {
      margin-top: 20px;
      font-size: 0.85rem;
      opacity: 0.55;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }

    @keyframes rise {
      to {
        transform: translateY(-110vh) scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>¡Para Vos! 🌻</h1>
    <p class="subtitle">
      Un detalle especial para iluminar tu día.
    </p>

    <div class="flower">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="center"></div>
    </div>

    <button id="openBtn" onclick="revealMessage()">
      Abrir mensaje ✨
    </button>

    <div class="message" id="msg">
      <h2>¡Feliz día! 💛</h2>
      <p>
        Que nunca te falten razones para sonreír
        y florecer siempre con luz propia.
      </p>
    </div>

    <div class="signature">
      Con cariño 💛
    </div>
  </div>

  <script>
    function revealMessage() {
      const btn = document.getElementById('openBtn');
      const msg = document.getElementById('msg');
      btn.style.display = 'none';
      msg.style.display = 'block';

      // Lluvia continua de flores y brillos
      setInterval(spawnPetal, 300);
      setInterval(spawnHeart, 500);
    }

    function spawnPetal() {
      const petal = document.createElement('div');
      petal.className = 'petal-fall';
      petal.textContent = '🌼';
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.fontSize = (16 + Math.random() * 20) + 'px';
      petal.style.animationDuration = (3 + Math.random() * 3) + 's';
      document.body.appendChild(petal);
      setTimeout(() => petal.remove(), 6000);
    }

    function spawnHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = '💛';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (14 + Math.random() * 16) + 'px';
      heart.style.animationDuration = (4 + Math.random() * 2) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
  </script>

</body>
